name: IWYU

on:
  schedule:
    - cron: "0 4 * * MON"
  workflow_dispatch:

concurrency:
  group: iwyu-actions
  cancel-in-progress: true

env:
  TZ: Europe/Berlin

defaults:
  run:
    shell: bash -Eexuo pipefail {0}

jobs:
  build:
    name: IWYU
    runs-on: ubuntu-latest
    environment: pr-bot # deployment branch: main
    if: github.repository_owner == 'seqan' || github.event_name == 'workflow_dispatch'
    container:
      image: ghcr.io/seqan/iwyu
    steps:
      - name: Create App token
        id: token
        uses: actions/create-github-app-token@v3 # locked via actions.lock
        with:
          client-id: ${{ vars.SEQAN_PR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SEQAN_PR_BOT_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Run IWYU
        uses: seqan/actions/iwyu@main
        with:
          configure_path: test/analyse
          additional_mapping: .github/config/custom.imp
          token: ${{ steps.token.outputs.token }}
          gpg_key: ${{ secrets.SEQAN_ACTIONS_GPG_KEY }}
          gpg_passphrase: ${{ secrets.SEQAN_ACTIONS_GPG_PASSPHRASE }}
